# CompleteP Verification - Duration Transfer
# Model A at 1M events: N=256, L=2, T=1M events
# Tests duration transfer: kappa = 1M/100k = 10
# LR should be scaled by 1/sqrt(10) = 0.316

data:
  max_per_device_batch_size: 2048
  train_dir: '/groups/pheno/inar/icecube_kaggle/v4_upgoing/memmapped_train_16.2M_127'
  val_dir: '/groups/pheno/inar/icecube_kaggle/v4_upgoing/memmapped_eval_150k_127'
  train_events: 1000000  # 10x base duration
  val_events: 149814
  pin_memory: false
  num_workers: 1
  persistent_workers: true
  sensor_geometry_path: '/groups/pheno/inar/icecube_kaggle/sensor_geometry.csv'

model:
  use_dom_positions: true
  embedding_dim: 256    # Same as base
  dom_embed_dim: 128
  num_heads: 8
  hidden_size: 1024
  num_layers: 2         # Same as base
  lambda_charge: 1.0
  use_final_layer_norm: true
  directional:
    hidden_size: 1024
  model_name: 'completep_duration_1M'

training:
  mask_prob: 0.25
  val_mask_prob: 0.25
  max_epochs: 50        # Same number of epochs
  logical_batch_size: 4096
  val_check_interval: 0.1  # More frequent validation
  gpus: 1
  precision: "16-mixed"
  gradient_clip_val: 1.0

  # CompleteP configuration - same base params
  # Duration scaling (1/sqrt(10)) is applied automatically
  completep:
    enabled: true
    n_base: 256
    l_base: 2
    t_base: 100000      # Base duration - kappa computed from this
    init_std_base: 0.02
    lr_base: 3e-4       # Same base LR - will be scaled by 1/sqrt(kappa)
    eps_base: 1e-8

  # OneCycle scheduler
  lr_scheduler: 'onecycle'
  max_lr: 3e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1e-8
  weight_decay: 0.1
  amsgrad: false

  pct_start: 0.01
  div_factor: 25.0
  final_div_factor: 10

  steps_per_epoch: null
  total_steps: null
  num_events: null

  project: 'completep-verification'

  early_stopping:
    enabled: false

  checkpoint:
    dirpath: 'checkpoints/completep_verification'
    save_top_k: 1
    monitor: 'val/loss'
    mode: 'min'
    save_last: true
    save_final: true

pretrained:
  model_type: 'flash'
  checkpoint_path: 'new'
  freeze_backbone: false
