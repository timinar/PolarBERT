# CompleteP Verification - Model B (Wide)
# Wide model: N=1024, L=2, T=100k events
# Tests width transfer: m_N = 1024/256 = 4

data:
  max_per_device_batch_size: 2048
  train_dir: '/groups/pheno/inar/icecube_kaggle/v4_upgoing/memmapped_train_16.2M_127'
  val_dir: '/groups/pheno/inar/icecube_kaggle/v4_upgoing/memmapped_eval_150k_127'
  train_events: 100000  # Same as base (kappa=1)
  val_events: 50000
  pin_memory: false
  num_workers: 1
  persistent_workers: true
  sensor_geometry_path: '/groups/pheno/inar/icecube_kaggle/sensor_geometry.csv'

model:
  use_dom_positions: true
  embedding_dim: 1024   # 4x base width
  dom_embed_dim: 512    # Scale proportionally
  num_heads: 16         # Scale with width
  hidden_size: 4096     # 4x embedding_dim
  num_layers: 2         # Same as base
  lambda_charge: 1.0
  use_final_layer_norm: true
  directional:
    hidden_size: 1024
  model_name: 'completep_wide_B'

training:
  mask_prob: 0.25
  val_mask_prob: 0.25
  max_epochs: 100
  logical_batch_size: 2048
  val_check_interval: 1.0
  gpus: 1
  precision: "16-mixed"
  gradient_clip_val: 1.0

  # CompleteP configuration - same base params as Model A
  completep:
    enabled: true
    n_base: 256         # Base embedding dimension
    l_base: 2           # Base number of layers
    t_base: 100000      # Base training duration (events)
    init_std_base: 0.02 # Base initialization std
    lr_base: 3e-4       # Same base LR as Model A
    eps_base: 1e-8      # Base Adam epsilon

  # OneCycle scheduler
  lr_scheduler: 'onecycle'
  max_lr: 3e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1e-8
  weight_decay: 0.1
  amsgrad: false

  pct_start: 0.01
  div_factor: 25.0
  final_div_factor: 10

  steps_per_epoch: null
  total_steps: null
  num_events: null

  project: 'completep-verification'

  early_stopping:
    enabled: false

  checkpoint:
    dirpath: 'checkpoints/completep_verification'
    save_top_k: 1
    monitor: 'val/loss'
    mode: 'min'
    save_last: true
    save_final: true

pretrained:
  model_type: 'flash'
  checkpoint_path: 'new'
  freeze_backbone: false
