# CompleteP Verification - Model C (Deep)
# Deep model: N=256, L=8, T=10M events
# Tests depth transfer: m_L = 8/2 = 4

data:
  max_per_device_batch_size: 2048
  train_dir: '/groups/pheno/inar/icecube_kaggle/v4_upgoing/memmapped_train_16.2M_127'
  val_dir: '/groups/pheno/inar/icecube_kaggle/v4_upgoing/memmapped_eval_150k_127'
  train_events: 10000000  # 10M events
  val_events: 50000
  pin_memory: false
  num_workers: 1
  persistent_workers: true
  sensor_geometry_path: '/groups/pheno/inar/icecube_kaggle/sensor_geometry.csv'
  shuffle_seed: 1337

model:
  use_dom_positions: true
  embedding_dim: 256    # Same as base
  dom_embed_dim: 128
  num_heads: 8
  hidden_size: 1024     # 4x embedding_dim
  num_layers: 8         # 4x base depth
  lambda_charge: 1.0
  use_final_layer_norm: true
  activation: gelu
  directional:
    hidden_size: 1024
  model_name: 'completep_deep_C'

training:
  mask_prob: 0.25
  val_mask_prob: 0.25
  max_epochs: 5
  logical_batch_size: 2048
  val_check_interval: 0.1  # 10 validations per epoch
  gpus: 1
  precision: "16-mixed"
  gradient_clip_val: 1.0

  # CompleteP configuration - same base params as Model A
  completep:
    enabled: true
    n_base: 256         # Base embedding dimension
    l_base: 2           # Base number of layers
    t_base: 10000000    # Match training events (no duration scaling)
    init_std_base: 0.02 # Base initialization std
    lr_base: 3e-4       # Same base LR as Model A
    eps_base: 1e-8      # Base Adam epsilon

  # OneCycle scheduler
  lr_scheduler: 'onecycle'
  max_lr: 3e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1e-8
  weight_decay: 0.1
  amsgrad: false

  pct_start: 0.05
  div_factor: 25.0
  final_div_factor: 1

  steps_per_epoch: null
  total_steps: null
  num_events: null

  project: 'completep-verification'

  early_stopping:
    enabled: false

  checkpoint:
    dirpath: 'checkpoints/completep_verification'
    save_top_k: 0
    monitor: 'val/loss'
    mode: 'min'
    save_last: false
    save_final: false

pretrained:
  model_type: 'flash'
  checkpoint_path: 'new'
  freeze_backbone: false
